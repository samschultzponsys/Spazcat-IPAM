<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="apple-touch-icon" href="/icon/apple-touch-icon.png" />
<script src="/static/brand.js"></script>
<link rel="manifest" href="/manifest.webmanifest" />
<title>Spazcat IPAM — Sign in</title>
<link rel="icon" href="/icon/favicon" />
<link rel="stylesheet" href="/api/fonts.css" />
<style>
  :root {
    --bg: #0a0a0c; --panel: #141418; --border: #2a2a33; --text: #e6e6ea;
    --muted: #8a8a96; --accent: #8b5cf6; --accent-2: #f5a142; --danger: #ef4444;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-display: var(--mono);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--mono); display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 340px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px 26px;
  }
  .brand {
    font-family: var(--font-display); font-weight: 800; letter-spacing: 2px;
    font-size: 20px; text-align: center; margin-bottom: 22px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 5px; }
  input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 11px 13px; font-family: var(--mono); font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 20px; padding: 12px; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: 9px;
    font-family: var(--mono); font-size: 14px; font-weight: 700;
  }
  button:hover { filter: brightness(1.1); }
  .err {
    color: var(--danger); font-size: 12px; margin-top: 14px; min-height: 16px; text-align: center;
    line-height: 1.45;
  }
  .sso { background: transparent; border: 1px solid var(--accent); color: var(--text); }
  .or {
    display: flex; align-items: center; gap: 10px; color: var(--muted);
    font-size: 11px; margin: 20px 0 0;
  }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  .note { color: var(--muted); font-size: 12px; text-align: center; line-height: 1.5; margin-top: 10px; }
  .hide { display: none; }
  @media (max-width: 640px) {
    input { font-size: 16px; }   /* no iOS zoom-on-focus */
    .card { padding: 24px 18px; }
    button { padding: 14px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand" id="brand">SPAZCAT IPAM</div>
    <div id="local" class="hide">
      <label for="u">Username</label>
      <input id="u" autocomplete="username" autofocus />
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" />
      <button id="go">Sign in</button>
    </div>
    <div id="or" class="or hide">or</div>
    <button id="sso" class="sso hide">Sign in with SSO</button>
    <div id="tokenNote" class="note hide">
      This instance also accepts an access link. Open the link you were given.
    </div>
    <div class="err" id="err"></div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const next = params.get("next") || "/";
  const err = $("err");
  if (params.get("error")) err.textContent = params.get("error");

  // name + logo font come from Settings (public endpoint, no login needed)
  fetch("/api/branding").then(r => r.json()).then(b => {
    if (b.app_name) {
      $("brand").textContent = b.app_name;
      document.title = b.app_name + " — Sign in";
    }
    if (b.font_logo) document.documentElement.style.setProperty("--font-display", b.font_logo);
    if (b.logo_style && window.SpazBrand) SpazBrand.applyLogo($("brand"), b.logo_style);
    if (b.icon_version && window.SpazBrand) SpazBrand.setIconVersion(b.icon_version);
  }).catch(() => {});

  // which sign-in methods apply to this connection (LAN vs WAN)
  fetch("/api/auth/config").then(r => r.json()).then(c => {
    if (c.blocked) {
      err.textContent = "Sign-in is misconfigured for this network, so access is blocked. " +
                        "Check the server log / IPAM_AUTH_* settings.";
      return;
    }
    const elevate = params.get("elevate");
    if (c.open && !elevate) { location = next; return; }
    if (c.open && elevate) {
      $("tokenNote").textContent = "This network doesn't require sign-in. Sign in to change security settings.";
      $("tokenNote").classList.remove("hide");
      if (!c.local && !c.oidc) $("tokenNote").textContent =
        "There's no password user or SSO set up to sign in with.";
    }
    if (c.local) $("local").classList.remove("hide");
    if (c.oidc) {
      $("sso").textContent = c.oidc_button || "Sign in with SSO";
      $("sso").classList.remove("hide");
      if (c.local) $("or").classList.remove("hide");
      else $("sso").style.marginTop = "0";
    }
    if (c.token && !c.open) {
      $("tokenNote").classList.remove("hide");
      if (!c.local && !c.oidc) $("tokenNote").textContent =
        "This instance is opened with an access link. Use the link you were given.";
    }
    if (c.local) $("u").focus();
  }).catch(() => { $("local").classList.remove("hide"); });

  $("sso").addEventListener("click", () => {
    location = "/auth/oidc/login?" + new URLSearchParams({next});
  });

  async function submit() {
    err.textContent = "";
    const username = $("u").value;
    const password = $("p").value;
    try {
      const r = await fetch("/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password, next}),
      });
      const d = await r.json();
      if (d.ok) { location = d.next || "/"; }
      else { err.textContent = d.error || "Sign in failed"; }
    } catch (e) { err.textContent = "Network error"; }
  }
  $("go").addEventListener("click", submit);
  document.querySelectorAll("#local input").forEach(el =>
    el.addEventListener("keydown", e => { if (e.key === "Enter") submit(); }));
</script>
</body>
</html>
