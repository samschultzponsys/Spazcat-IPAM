          <input type="range" min="1" max="6" value={v.outline_width} onChange={e => set("outline_width", parseInt(e.target.value))} /></div>}
      <div className="field check" style={{alignSelf: "end"}}><label>
        <input type="checkbox" checked={!!v.glow} onChange={e => set("glow", e.target.checked)} /> Glow</label></div>
    </div>
    {v.fill !== "outline" && <>
      <div className="field"><label>Pattern overlay</label>
        <select value={v.pattern} onChange={e => set("pattern", e.target.value)}>
          {Object.entries(PATTERN_LABELS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
        </select></div>
      {v.pattern !== "none" &&
        <div className="style-grid">
          <div className="field"><label>Pattern color</label>
            <input type="color" className="swatch-input" value={v.pattern_color} onChange={e => set("pattern_color", e.target.value)} /></div>
          <div className="field"><label>Strength — {v.pattern_opacity}%</label>
            <input type="range" min="5" max="100" step="5" value={v.pattern_opacity} onChange={e => set("pattern_opacity", parseInt(e.target.value))} /></div>
          <div className="field"><label>Scale — {v.pattern_size}px</label>
            <input type="range" min="2" max="30" value={v.pattern_size} onChange={e => set("pattern_size", parseInt(e.target.value))} /></div>
        </div>}
    </>}
    <div className="hint" style={{marginTop: "-4px"}}>The logo at the top of the page previews your changes. Save to keep them.</div>
  </>;
}

function IconEditor({value, onChange, logoStyle, settings, reload, flash}) {
  const v = value;
  const set = (k, x) => onChange({...v, [k]: x});
  const custom = settings.icon_custom;
  const [busy, setBusy] = useState(false);
  const fileRef = React.useRef(null);
  const upload = async (file) => {
    if (!file) return;
    setBusy(true);
    const fd = new FormData(); fd.append("file", file);
    const r = await fetch("/api/branding/icon", {method: "POST", body: fd}).then(x => x.json()).catch(() => ({error: "Upload failed"}));
    setBusy(false);
    if (fileRef.current) fileRef.current.value = "";
    if (!r.ok) { flash(r.error || "Upload failed"); return; }
    flash("Icon uploaded"); reload();
  };
  const remove = async () => {
    await api("/api/branding/icon", {method: "DELETE"});
    flash("Back to the stock icon"); reload();
  };
  const matchLogo = () => {
    if (!logoStyle) return;
    const cs = logoStyle.colors || [];
    onChange({...v, fill: cs.length > 1 && logoStyle.fill === "gradient" ? "gradient" : "solid",
              colors: [cs[0], cs[cs.length - 1]], angle: logoStyle.fill === "gradient" ? (logoStyle.angle + 45) % 360 : v.angle});
  };
  const ver = settings.icon_version || "1";
  return <>
    <div className="section-label">Icon (browser tab + home screen)</div>
    <div className="icon-row">
      <div className="icon-preview" title="Preview"
        dangerouslySetInnerHTML={custom ? undefined : {__html: SpazBrand.iconSvg(v)}}>
        {custom ? <img src={`/icon/icon-192.png?v=${ver}`} alt="" /> : null}
      </div>
      <div className="icon-actions">
        <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/x-icon,image/vnd.microsoft.icon,image/svg+xml,.ico,.svg"
          style={{display: "none"}} onChange={e => upload(e.target.files[0])} />
        <button type="button" onClick={() => fileRef.current.click()} disabled={busy}>
          {busy ? "Uploading…" : custom ? "Replace upload" : "Upload your own"}</button>
        {custom && <button type="button" className="danger" onClick={remove}>Use stock icon</button>}
        <div className="hint">PNG, JPG, WebP, GIF, ICO or SVG, up to 2 MB. A square PNG of 512px or more
          looks best on home screens. SVG uploads are used for the browser tab only.</div>
      </div>
    </div>
    {!custom && <>
      <div className="field"><label>Background</label>
        <Segmented value={v.fill} onChange={x => set("fill", x)} options={[["gradient", "Gradient"], ["solid", "Solid"]]} /></div>
      <div className="field"><label>{v.fill === "gradient" ? "Colors" : "Color"}
        <button type="button" className="link" onClick={matchLogo}>match logo</button></label>
        <ColorList colors={v.fill === "gradient" ? (v.colors.length > 1 ? v.colors : [v.colors[0], v.colors[0]]) : v.colors.slice(0, 1)}
          max={v.fill === "gradient" ? 2 : 1} min={v.fill === "gradient" ? 2 : 1} onChange={cs => set("colors", cs)} /></div>
      <div className="style-grid">
        {v.fill === "gradient" &&
          <div className="field"><label>Direction — {v.angle}°</label>
            <input type="range" min="0" max="360" step="15" value={v.angle} onChange={e => set("angle", parseInt(e.target.value))} /></div>}
        <div className="field"><label>Tile color</label>
          <input type="color" className="swatch-input" value={v.tile_color} onChange={e => set("tile_color", e.target.value)} /></div>
      </div>
      <div className="field"><label>Shape</label>
        <Segmented value={v.shape} onChange={x => set("shape", x)}
          options={[["rounded", "Rounded"], ["circle", "Circle"], ["square", "Square"]]} /></div>
    </>}
  </>;
}

const METHOD_LABELS = {local: "Username + password", oidc: "SSO (OIDC)", token: "Access link / token"};

function ZonePicker({zone, value, onChange, disabled, locked}) {
  const none = value.includes("none");
  const toggle = (m) => {
    if (m === "none") return onChange(none ? [] : ["none"]);
    const rest = value.filter(x => x !== "none" && x !== m);
    onChange(value.includes(m) ? rest : [...rest, m]);
  };
  return (
    <div className="field">
      <label>{zone === "lan" ? "LAN (your network)" : "WAN (internet / through a proxy)"}
        {locked && <span className="tag env">set by IPAM_AUTH_{zone.toUpperCase()}</span>}</label>
      <div className="zone-row">
        <label className="zone-opt"><input type="checkbox" checked={none} disabled={disabled}
          onChange={()=>toggle("none")} /> No sign-in</label>
        {["local","oidc","token"].map(m => (
          <label className="zone-opt" key={m}><input type="checkbox" checked={value.includes(m)}
            disabled={disabled} onChange={()=>toggle(m)} /> {METHOD_LABELS[m]}</label>
        ))}
      </div>
    </div>
  );
}

function SecurityTab({flash, reload}) {
  const [r, setR] = useState(null);
  const [f, setF] = useState(null);
  const [err, setErr] = useState(null);
  const [newUser, setNewUser] = useState({username: "", password: ""});
  const [pwFor, setPwFor] = useState(null);
  const [pw, setPw] = useState("");
  const [newTok, setNewTok] = useState("");
  const [created, setCreated] = useState(null);
  const [oidcTest, setOidcTest] = useState(null);
  // resetForm: only on first load and after saving the form - user/token
  // actions refresh the lists without throwing away unsaved form edits
  const load = async (resetForm) => {
    const x = await api("/api/auth/status");
    setR(x);
    if (resetForm) setF({...x.config, oidc: {...x.config.oidc, client_secret: ""}});
    if (reload) reload();
  };
  useEffect(() => { load(true); }, []);
  if (!r || !f) return <div className="hint">Loading…</div>;

  const edit = r.can_edit;
  const locked = (k) => r.locked.includes(k);
  const dis = (k) => !edit || locked(k);
  const set = (k, v) => setF(prev => ({...prev, [k]: v}));
  const setO = (k, v) => setF(prev => ({...prev, oidc: {...prev.oidc, [k]: v}}));
  const envTag = (k, name) => locked(k) && <span className="tag env">set by {name}</span>;
  const call = async (method, path, body) => {
    setErr(null);
    const res = await api(path, {method, body: body ? JSON.stringify(body) : undefined});
    if (res && res.error) { setErr(res.error); return null; }
    return res || {};
  };

  const save = async (confirmed) => {
    setErr(null);
    const res = await api("/api/auth/settings", {method: "PUT",
      body: JSON.stringify({...f, confirm: !!confirmed})});
    if (res.confirm) {
      if (window.confirm(res.confirm + "\n\nSave anyway?")) return save(true);
      return;
    }
    if (res.error) { setErr(res.error); return; }
    flash("Security settings saved");
    load(true);
  };
  const addUser = async () => {
    if (await call("POST", "/api/auth/users", newUser)) {
      setNewUser({username: "", password: ""}); flash("User added"); load();
    }
  };
  const setPassword = async (name) => {
    if (await call("PUT", `/api/auth/users/${encodeURIComponent(name)}`, {password: pw})) {
      setPwFor(null); setPw(""); flash(`Password changed for ${name}`); load();
    }
  };
  const delUser = async (name) => {
    if (!confirm(`Delete user ${name}?`)) return;
    if (await call("DELETE", `/api/auth/users/${encodeURIComponent(name)}`)) { flash("User deleted"); load(); }
  };
  const addToken = async () => {
    const res = await call("POST", "/api/auth/tokens", {label: newTok});
    if (res) { setCreated(res); setNewTok(""); load(); }
  };
  const delToken = async (label) => {
    if (!confirm(`Revoke access token "${label}"? Links using it stop working.`)) return;
    if (await call("DELETE", `/api/auth/tokens/${encodeURIComponent(label)}`)) { flash("Token revoked"); load(); }
  };
  const testOidc = async () => {
    setOidcTest({msg: "Checking…"});
    const res = await api("/api/auth/oidc/test", {method: "POST", body: JSON.stringify(f.oidc)});
    setOidcTest(res.ok ? {ok: true, msg: `Found ${res.issuer}${res.pkce ? " (PKCE supported)" : ""}`}
                       : {ok: false, msg: res.error});
  };
  const copy = (t) => { try { navigator.clipboard.writeText(t); flash("Copied"); } catch(e) {} };

  return <>
    {(r.warnings||[]).map((w,i)=><div key={i} className="sec-warn">⚠ {w}</div>)}
    <table className="sec-table"><tbody>
      <tr><td>You are connecting from</td><td>{r.client_ip || "?"} → <b>{r.zone.toUpperCase()}</b>
        {r.via_proxy ? ` (via proxy ${r.peer_ip})` : ""}</td></tr>
      <tr><td>Signed in</td><td>{r.authed_via ? `${r.user || "?"} via ${r.authed_via}` : "no"}</td></tr>
    </tbody></table>

    {!edit && (
      <div className="help-box">
        Only someone signed in with a password or SSO can change these settings.{" "}
        <a href={"/login?elevate=1&next=" + encodeURIComponent("/")}>Sign in to edit</a>
      </div>
    )}

    <div className="section-label">Who needs to sign in</div>
    <ZonePicker zone="lan" value={f.lan} disabled={dis("lan")} locked={locked("lan")} onChange={v=>set("lan", v)} />
    <ZonePicker zone="wan" value={f.wan} disabled={dis("wan")} locked={locked("wan")} onChange={v=>set("wan", v)} />
    <div className="hint" style={{marginTop:"-6px", marginBottom:"10px"}}>
      Tick several to allow any of them. "No sign-in" can't be combined.
    </div>

    <details className="sec-more">
      <summary>Networks &amp; reverse proxy</summary>
      <div className="field"><label>LAN networks (CIDR, comma-separated) {envTag("lan_networks","IPAM_LAN_NETWORKS")}</label>
        <textarea rows="2" value={f.lan_networks} disabled={dis("lan_networks")} onChange={e=>set("lan_networks", e.target.value)} /></div>
      <div className="field"><label>Trusted proxies — allowed to set X-Forwarded-For {envTag("trusted_proxies","IPAM_TRUSTED_PROXIES")}</label>
        <textarea rows="2" value={f.trusted_proxies} disabled={dis("trusted_proxies")} onChange={e=>set("trusted_proxies", e.target.value)} /></div>
      <div className="field"><label>Public URL (optional) {envTag("public_url","IPAM_PUBLIC_URL")}</label>
        <input value={f.public_url} disabled={dis("public_url")} placeholder="https://ipam.example.com"
          onChange={e=>set("public_url", e.target.value)} />
        <div className="hint">Only needed if your proxy doesn't send X-Forwarded-Host/Proto. Currently using {r.public_url_effective}.</div></div>
      <div className="style-grid">
        <div className="field"><label>Stay signed in (days) {envTag("session_days","IPAM_SESSION_DAYS")}</label>
          <input type="number" min="1" value={f.session_days} disabled={dis("session_days")} onChange={e=>set("session_days", e.target.value)} /></div>
        <div className="field check" style={{alignSelf:"end"}}><label>
          <input type="checkbox" checked={!!f.cookie_secure} disabled={dis("cookie_secure")} onChange={e=>set("cookie_secure", e.target.checked)} />
          HTTPS-only cookie (only if you never use plain http)</label></div>
      </div>
    </details>

    <details className="sec-more" open={f.lan.includes("oidc") || f.wan.includes("oidc") || undefined}>
      <summary>SSO (OIDC) {r.oidc_ready ? <span className="pill on">configured</span> : null}</summary>
      <div className="hint" style={{marginBottom:"10px"}}>
        Register this redirect URI at your provider: <code>{r.oidc_redirect_uri}</code>
        <button className="link" onClick={()=>copy(r.oidc_redirect_uri)}>copy</button>
      </div>
      <div className="field"><label>Issuer URL {envTag("oidc.issuer","IPAM_OIDC_ISSUER")}</label>
        <input value={f.oidc.issuer} disabled={dis("oidc.issuer")} placeholder="https://auth.example.com/application/o/spazcat-ipam/"
          onChange={e=>setO("issuer", e.target.value)} /></div>
      <div className="style-grid">
        <div className="field"><label>Client ID {envTag("oidc.client_id","IPAM_OIDC_CLIENT_ID")}</label>
          <input value={f.oidc.client_id} disabled={dis("oidc.client_id")} onChange={e=>setO("client_id", e.target.value)} /></div>
        <div className="field"><label>Client secret {envTag("oidc.client_secret","IPAM_OIDC_CLIENT_SECRET")}
          {!locked("oidc.client_secret") && f.oidc.client_secret_set && <span style={{color:"var(--ok)"}}> ✓ saved</span>}</label>
          <input type="password" value={f.oidc.client_secret} disabled={dis("oidc.client_secret")}
            placeholder={f.oidc.client_secret_set ? "•••••••• (leave blank to keep)" : ""}
            onChange={e=>setO("client_secret", e.target.value)} /></div>
        <div className="field"><label>Login button text {envTag("oidc.button_text","IPAM_OIDC_BUTTON_TEXT")}</label>
          <input value={f.oidc.button_text} disabled={dis("oidc.button_text")} onChange={e=>setO("button_text", e.target.value)} /></div>
        <div className="field"><label>Scopes {envTag("oidc.scopes","IPAM_OIDC_SCOPES")}</label>
          <input value={f.oidc.scopes} disabled={dis("oidc.scopes")} onChange={e=>setO("scopes", e.target.value)} /></div>
        <div className="field"><label>Allowed users (optional) {envTag("oidc.allowed_users","IPAM_OIDC_ALLOWED_USERS")}</label>
          <input value={f.oidc.allowed_users} disabled={dis("oidc.allowed_users")} placeholder="sam@example.com"
            onChange={e=>setO("allowed_users", e.target.value)} /></div>
        <div className="field"><label>Allowed groups (optional) {envTag("oidc.allowed_groups","IPAM_OIDC_ALLOWED_GROUPS")}</label>
          <input value={f.oidc.allowed_groups} disabled={dis("oidc.allowed_groups")} placeholder="ipam-admins"
            onChange={e=>setO("allowed_groups", e.target.value)} /></div>
      </div>
      <div className="field check"><label>
        <input type="checkbox" checked={!!f.oidc.auto_login} disabled={dis("oidc.auto_login")} onChange={e=>setO("auto_login", e.target.checked)} />
        Skip the login page and go straight to SSO (<code>/login?manual=1</code> still shows it){envTag("oidc.auto_login","IPAM_OIDC_AUTO_LOGIN")}</label></div>
      <button onClick={testOidc} disabled={!edit}>Test provider</button>
      {oidcTest && <div className={"test-result " + (oidcTest.ok ? "ok" : "err")}>{oidcTest.msg}</div>}
    </details>

    {err && <div className="test-result err" style={{marginBottom:"8px"}}>{err}</div>}
    {edit && <div style={{display:"flex", justifyContent:"flex-end", margin:"4px 0 6px"}}>
      <button className="primary" onClick={()=>save(false)}>Save security settings</button></div>}

    <div className="section-label">Users (username + password)</div>
    <div className="excluded-list" style={{maxHeight:"none"}}>
      {r.users.map(u => (
        <div className="excluded-row" key={u.name}>

            ? <><input type="password" className="mini" placeholder="new password (8+)" value={pw}

      <button onClick={addUser} disabled={!newUser.username || !newUser.password}>+ Add user</button>

    <div className="hint">Scripts can also use HTTP Basic auth with these users.</div>

    {created && (
      <div className="update-box">
        <b>Token created. Copy it now; it won't be shown again.</b><br/>

        <button className="link" onClick={()=>copy(created.link)}>copy link</button><br/>
        Header: <code>Authorization: Bearer {created.token}</code>
        <button className="link" onClick={()=>copy(created.token)}>copy token</button>
      </div>
    )}
    <div className="excluded-list" style={{maxHeight:"none"}}>
      {r.tokens.length === 0 && <div className="excluded-empty">No tokens.</div>}
      {r.tokens.map(t => (
        <div className="excluded-row" key={t.label}>
          <span className="ex-name">{t.label} {t.env && <span className="tag env">from environment</span>}</span>
          <span className="ex-ip">{t.created ? new Date(t.created*1000).toLocaleDateString() : ""}</span>
          {edit && !t.env && <button className="danger" onClick={()=>delToken(t.label)}>revoke</button>}
        </div>
      ))}
    </div>
    {edit && <div className="inline-add">
      <input className="mini" placeholder="label, e.g. wall-tablet" value={newTok} onChange={e=>setNewTok(e.target.value)} />
      <button onClick={addToken} disabled={!newTok}>+ Create token</button>
    </div>}

    <div className="help-box" style={{marginTop:"14px"}}>
      Locked out? Environment variables override anything set here (see the README), and
      <code> IPAM_AUTH_RESET=true</code> restores the defaults with a new admin password in the log.
    </div>
  </>;
}

// Minimal markdown for CHANGELOG.md: ### headings, "- " bullets (with
// indented continuation lines), paragraphs, **bold**, *em* and `code`.
function inlineMd(text) {
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*]+\*)/g).map((part, i) => {
    if (/^\*\*[^*]+\*\*$/.test(part)) return <b key={i}>{part.slice(2,-2)}</b>;
    if (/^`[^`]+`$/.test(part)) return <code key={i}>{part.slice(1,-1)}</code>;
    if (/^\*[^*]+\*$/.test(part)) return <em key={i}>{part.slice(1,-1)}</em>;
    return part;
  });
}
function MdBlock({text}) {
  const out = [];
  let list = null, para = null;
  const flush = () => {
    if (list) { out.push(<ul key={out.length}>{list.map((l,i)=><li key={i}>{inlineMd(l)}</li>)}</ul>); list = null; }
    if (para) { out.push(<p key={out.length}>{inlineMd(para)}</p>); para = null; }
  };
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    if (!line.trim()) { flush(); continue; }
    if (line.startsWith("### ")) { flush(); out.push(<h4 key={out.length}>{line.slice(4)}</h4>); continue; }
    if (/^\s*[-*] /.test(line)) {
      if (para) flush();
      list = list || [];
      list.push(line.replace(/^\s*[-*] /, ""));
      continue;
    }
    if (list && /^\s+/.test(raw)) { list[list.length-1] += " " + line.trim(); continue; }
    if (list) flush();
    para = para ? para + " " + line.trim() : line.trim();
  }
  flush();
  return <div className="cl-body">{out}</div>;
}

function ChangelogModal({ver, setVer, onClose}) {
  const [checking, setChecking] = useState(false);
  const u = ver.update || {};
  const checkNow = async () => {
    setChecking(true);
    const r = await api("/api/version/check", {method:"POST"});
    setChecking(false);
    if (r.update) setVer({...ver, update: r.update});
  };
  const when = u.checked_at ? new Date(u.checked_at*1000).toLocaleString() : "never";
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal wide" onClick={e=>e.stopPropagation()}>
        <CloseX onClick={onClose} />
        <h3>What's new — v{ver.version}</h3>
        {u.update_available && (
          <div className="update-box">
            <b>Update available: v{u.latest}</b><br/>
            Pull the new image to upgrade (your <code>data/</code> folder carries over and is backed up
            automatically): <code>docker compose pull &amp;&amp; docker compose up -d</code>
          </div>
        )}
        <div style={{fontSize:"0.7em", color:"var(--muted)", marginBottom:"12px", display:"flex", gap:"8px", alignItems:"center", flexWrap:"wrap"}}>
          {u.enabled
            ? <>{u.update_available ? "" : "You're up to date. "}Last checked: {when}
                {u.error && <span style={{color:"var(--danger)"}}> (check failed)</span>}
                <button style={{padding:"3px 9px"}} disabled={checking} onClick={checkNow}>
                  {checking ? "checking…" : "check now"}</button></>
            : <>Update checks are off (Settings → Maintenance).</>}
        </div>
        {(ver.changelog||[]).map(e=>(
          <div className="cl-entry" key={e.version}>
            <div className="cl-head">
              <span className="cl-ver">v{e.version}</span>
              {e.date && <span className="cl-date">{e.date}</span>}
              {e.version === ver.version && <span className="tag cl-cur">INSTALLED</span>}
            </div>
            <MdBlock text={e.body} />
          </div>
        ))}
        <div className="modal-actions">
          <span></span>
          <button className="primary" onClick={onClose}>Got it</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
