<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spazcat IPAM</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<link rel="apple-touch-icon" href="/static/favicon.svg" />
<!-- @font-face rules for every file in static/fonts/ and data/fonts/,
     generated by the server. Pick them in Settings → Appearance. -->
<link rel="stylesheet" href="/api/fonts.css" />
<style>
  :root {
    --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-display: var(--font-mono);   /* logo / wordmark */
    --font-head: var(--font-mono);      /* pool names, dialog titles */
    --font-body: var(--font-mono);      /* everything else */
    --fs: 18px;
    --bg: #0a0a0c;
    --panel: #141418;
    --panel-2: #1b1b21;
    --border: #2a2a33;
    --text: #e6e6ea;
    --muted: #8a8a96;
    --accent: #8b5cf6;
    --accent-2: #f5a142;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  body.light {
    --bg: #f4f4f7;
    --panel: #ffffff;
    --panel-2: #ececf1;
    --border: #d3d3dd;
    --text: #1a1a20;
    --muted: #6a6a76;
    --accent: #7c3aed;
    --accent-2: #d97706;
    --danger: #dc2626;
    --ok: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: var(--fs);
    transition: background .15s ease, color .15s ease;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 18px 80px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; gap: 12px; flex-wrap: wrap;
  }
  .title {
    font-family: var(--font-display);
    font-weight: 800; letter-spacing: 3px; font-size: 24px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .count { color: var(--muted); font-size: 0.72em; margin-right: 6px; }
  button {
    font-family: inherit; font-size: 0.8em; cursor: pointer;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; transition: all .15s ease;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); border-color: transparent; }
  button.danger:hover { border-color: var(--danger); }
  button.link { background: none; border: none; padding: 0 4px; color: var(--accent); text-decoration: underline; font-size: 1em; }
  .row-input {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-family: inherit; font-size: 0.9em;
  }
  .row-input:focus { outline: none; border-color: var(--accent); }

  .pool {
    border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 16px; overflow: hidden;
  }
  .pool-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  .pool-dot { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .pool-name { font-family: var(--font-head); font-weight: 700; letter-spacing: 1px; font-size: 1em; }
  .pool-meta { color: var(--muted); font-size: 0.82em; }
  .pool-meta .sub { color: var(--accent-2); }
  .pool-head .spacer { flex: 1; }
  .caret {
    background: none; border: none; padding: 0 2px; color: var(--muted);
    font-size: 0.8em; width: 1.4em; line-height: 1; transition: transform .15s ease;
  }
  .caret:hover { color: var(--text); border: none; }
  .caret.closed { transform: rotate(-90deg); }
  .pool.collapsed .pool-head { border-bottom: none; }
  .pool.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .pool-preview { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .hidden-note { color: var(--muted); font-size: 0.72em; margin: -4px 0 14px; }
  .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .style-grid .field.check { margin-bottom: 6px; }
  .section-label {
    font-family: var(--font-head); color: var(--accent-2); font-size: 0.78em;
    margin: 16px 0 10px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  input[type=range] { padding: 0 !important; }
  .sec-table { width: 100%; font-size: 0.74em; border-collapse: collapse; margin-bottom: 12px; }
  .sec-table td { padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .sec-table td:first-child { color: var(--muted); white-space: nowrap; width: 38%; }
  .sec-warn { color: var(--danger); font-size: 0.74em; margin-bottom: 8px; line-height: 1.45; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); margin: 0 4px 2px 0; }
  .pill.on { border-color: var(--ok); color: var(--ok); }
  .pool-actions button { padding: 5px 9px; font-size: 0.72em; }
  .pool-body { padding: 8px; min-height: 44px; }
  .pool-body.drag-over { background: rgba(139,92,246,0.08); }
  .empty-hint { color: var(--muted); font-size: 0.72em; padding: 10px 8px; }

  .dev {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 11px; border-radius: 8px; cursor: grab;
    border: 1px solid transparent; border-left: 4px solid transparent;
    font-size: 1em;
  }
  .dev:hover { border-color: var(--border); }
  .dev.offline { opacity: 0.38; }
  .dev.offline:hover { opacity: 0.85; }
  .dev .grip { color: var(--muted); font-size: 1em; cursor: grab; }
  .dev .ip { font-weight: 700; min-width: 8em; display: flex; align-items: center; gap: 6px; }
  .dev .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .nm .host { color: var(--muted); font-size: 0.82em; margin-left: 6px; }
  .dev .mac { color: var(--muted); font-size: 0.82em; min-width: 9em; }
  .dev .badges { display: flex; gap: 5px; }
  .tag {
    font-size: 0.68em; padding: 2px 7px; border-radius: 5px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .tag.res { color: var(--accent-2); border-color: var(--accent-2); }
  .tag.manual { color: var(--accent); border-color: var(--accent); }
  .tag.dup { color: var(--danger); border-color: var(--danger); font-weight: 700; }
  .tag.stale { border-style: dashed; }
  .tag.exp { color: var(--accent-2); border-color: var(--accent-2); margin-left: 6px; }
  .lockbtn {
    background: transparent; border: none; cursor: pointer; font-size: 0.85em;
    padding: 2px 4px; opacity: 0.45; line-height: 1;
  }
  .lockbtn:hover { opacity: 1; border: none; }
  .lockbtn.on { opacity: 1; }
  .dev .ed { opacity: 0; display: flex; gap: 4px; }
  .dev:hover .ed { opacity: 1; }
  .ed button { padding: 4px 8px; font-size: 0.7em; }

  .warn-banner {
    background: rgba(239,68,68,0.12); border: 1px solid var(--danger);
    color: #fecaca; border-radius: 10px; padding: 10px 14px;
    margin-bottom: 16px; font-size: 0.82em; line-height: 1.5;
  }
  .warn-banner b { color: #fff; }
  body.light .warn-banner { background: rgba(220,38,38,0.10); color: #991b1b; }
  body.light .warn-banner b { color: #7f1d1d; }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .filters .search { flex: 1; min-width: 200px; }
  .toggle-btn.active { background: var(--accent-2); border-color: var(--accent-2); color: #14110b; font-weight: 700; }
  .swatch-wheel {
    width: 26px; height: 26px; border-radius: 7px; cursor: pointer;
    padding: 0; border: 2px solid transparent; overflow: hidden;
    background: conic-gradient(from 0deg,
      #ef4444, #f5a142, #eab308, #22c55e, #06b6d4, #3b82f6, #8b5cf6, #ec4899, #ef4444);
    -webkit-appearance: none; appearance: none;
  }
  .swatch-wheel.sel { border-color: var(--text); }
  /* beat the generic ".field input" rule so the wheel stays a small swatch */
  .field input.swatch-wheel {
    width: 26px; height: 26px; padding: 0; border-radius: 7px;
    border: 2px solid transparent;
    background: conic-gradient(from 0deg,
      #ef4444, #f5a142, #eab308, #22c55e, #06b6d4, #3b82f6, #8b5cf6, #ec4899, #ef4444);
  }
  .field input.swatch-wheel.sel { border-color: var(--text); }
  .swatch-wheel::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch-wheel::-webkit-color-swatch { border: none; opacity: 0; }
  .swatch-wheel::-moz-color-swatch { border: none; opacity: 0; }

  .excluded-block > label { display: block; color: var(--muted); font-size: 0.82em; margin-bottom: 8px; }
  .excluded-empty { color: var(--muted); font-size: 0.82em; }
  .excluded-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .excluded-row { display: flex; align-items: center; gap: 10px; font-size: 0.82em; }
  .excluded-row .ex-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .excluded-row .ex-ip { color: var(--muted); min-width: 6em; }
  .excluded-row .ex-mac { color: var(--muted); }
  .excluded-row button { padding: 3px 9px; }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; width: 440px; max-width: 92vw;
    max-height: 88vh; overflow: auto;
  }
  .modal.wide { width: 580px; }
  .modal h3 { font-family: var(--font-head); margin: 0 0 14px; letter-spacing: 1px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; color: var(--muted); font-size: 0.72em; margin-bottom: 5px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; font-family: inherit; font-size: 0.85em;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field textarea.key { font-size: 0.7em; }
  .field .inline { display: flex; gap: 8px; }
  .field .inline input { flex: 1; }
  .field .inline select { width: auto; }
  .field .hint { color: var(--muted); font-size: 0.68em; margin-top: 4px; line-height: 1.45; }
  .check label { display: flex; gap: 8px; align-items: flex-start; line-height: 1.4; }
  .check input { width: auto !important; margin-top: 2px; }
  .help-box {
    font-size: 0.72em; color: var(--muted); line-height: 1.5;
    border: 1px dashed var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px;
  }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tabs button {
    background: none; border: none; border-bottom: 2px solid transparent;
    border-radius: 0; padding: 8px 10px; color: var(--muted); font-size: 0.76em;
  }
  .tabs button:hover { border-color: transparent; color: var(--text); }
  .tabs button.on, .tabs button.on:hover { color: var(--text); border-bottom-color: var(--accent); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .swatch { width: 26px; height: 26px; border-radius: 7px; cursor: pointer; border: 2px solid transparent; }
  .swatch.sel { border-color: #fff; }
  .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .modal-actions .right { display: flex; gap: 8px; }
  .test-result { font-size: 0.72em; margin-top: 8px; }
  .test-result.ok { color: var(--ok); }
  .test-result.err { color: var(--danger); }
  .add-bar { display: flex; gap: 10px; margin-bottom: 22px; }
  .add-bar input { flex: 1; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--accent);
    padding: 10px 18px; border-radius: 10px; font-size: 0.8em; z-index: 60;
    max-width: 90vw;
  }

  /* version tag + changelog */
  .version-tag {
    position: fixed; left: 14px; bottom: 12px; z-index: 40;
    display: flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 11px; font-size: 12px; color: var(--muted);
  }
  .version-tag:hover { color: var(--text); }
  .update-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2);
    box-shadow: 0 0 0 0 rgba(245,161,66,0.7); animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(245,161,66,0.7); }
    70% { box-shadow: 0 0 0 7px rgba(245,161,66,0); }
    100% { box-shadow: 0 0 0 0 rgba(245,161,66,0); }
  }
  .update-box {
    border: 1px solid var(--accent-2); border-radius: 10px; padding: 10px 12px;
    margin-bottom: 14px; font-size: 0.78em; line-height: 1.5;
  }
  .update-box code { color: var(--accent-2); }
  .cl-entry { border-top: 1px solid var(--border); padding: 12px 0 4px; }
  .cl-entry:first-of-type { border-top: none; padding-top: 0; }
  .cl-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .cl-ver { font-family: var(--font-head); font-weight: 700; font-size: 1.05em; }
  .cl-date { color: var(--muted); font-size: 0.72em; }
  .cl-cur { font-size: 0.62em; }
  .cl-body { font-size: 0.78em; line-height: 1.55; }
  .cl-body h4 { font-family: var(--font-head); margin: 10px 0 4px; font-size: 0.95em; color: var(--accent-2); }
  .cl-body ul { margin: 0; padding-left: 18px; }
  .cl-body li { margin-bottom: 4px; }
  .cl-body p { margin: 4px 0; color: var(--muted); }
  .cl-body code { background: var(--panel-2); padding: 0 4px; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const PALETTE = ["#8b5cf6","#f5a142","#22c55e","#06b6d4","#ec4899",
                 "#eab308","#3b82f6","#ef4444","#14b8a6","#a855f7","#6b7280"];
const SEEN_KEY = "ipam-seen-version";

function hexToRgba(hex, a) {
  const h = hex.replace("#","");
  const n = parseInt(h.length===3 ? h.split("").map(c=>c+c).join("") : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

async function api(path, opts) {
  const r = await fetch(path, {
    headers: {"Content-Type":"application/json"}, ...opts
  });
  if (r.status === 401) { window.location = "/login"; return {}; }
  return r.json();
}

function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

// css font stack for a font id, falling back to the slot's default
function fontCss(settings, slot, id) {
  const opts = settings.font_options || [];
  const pick = id || (settings.font_defaults||{})[slot];
  const o = opts.find(x => x.id === pick);
  return o ? o.css : null;
}

function App() {
  const [state, setState] = useState({pools:[], settings:{}, total:0});
  const [dragId, setDragId] = useState(null);
  const [overPool, setOverPool] = useState(null);
  const [editDevice, setEditDevice] = useState(null);
  const [editPool, setEditPool] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [toast, setToast] = useState(null);
  const [newItem, setNewItem] = useState("");
  const [query, setQuery] = useState("");
  const [resOnly, setResOnly] = useState(false);
  const [fontPreview, setFontPreview] = useState(null);   // unsaved Appearance picks
  const [ver, setVer] = useState(null);                   // {version, changelog, update}
  const [showLog, setShowLog] = useState(false);
  const [showHidden, setShowHidden] = useState(false);
  // collapsed pools are a per-browser view preference
  const [collapsed, setCollapsed] = useState(() => {
    try { return JSON.parse(lsGet("ipam-collapsed") || "[]"); } catch(e) { return []; }
  });
  const toggleCollapsed = (id) => setCollapsed(prev => {
    const next = prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id];
    lsSet("ipam-collapsed", JSON.stringify(next));
    return next;
  });
  // localStorage is only a pre-load hint to avoid a flash; the DB (per-instance)
  // is the source of truth, applied once state loads and pushed back on change.
  const [theme, setThemeState] = useState(lsGet("ipam-theme") || "dark");
  const [fs, setFsState] = useState(() => {
    const v = lsGet("ipam-fs");
    return v ? parseInt(v) : 18;
  });
  const bootstrapped = React.useRef(false);

  useEffect(() => {
    document.body.classList.toggle("light", theme === "light");
    lsSet("ipam-theme", theme);
  }, [theme]);
  useEffect(() => {
    document.documentElement.style.setProperty("--fs", fs + "px");
    lsSet("ipam-fs", String(fs));
  }, [fs]);

  // fonts: saved choice, or the live preview while Settings is open
  const s = state.settings;
  useEffect(() => {
    if (!s.font_css) return;
    const root = document.documentElement.style;
    const slots = {logo: "--font-display", head: "--font-head", body: "--font-body"};
    for (const [slot, cssVar] of Object.entries(slots)) {
      const css = fontPreview ? fontCss(s, slot, fontPreview[slot]) : s.font_css[slot];
      if (css) root.setProperty(cssVar, css);
    }
  }, [s.font_css, s.font_options, fontPreview]);

  const appName = s.app_name || "SPAZCAT IPAM";
  useEffect(() => { document.title = appName; }, [appName]);

  // user-initiated changes: update UI immediately AND persist to the instance
  const setTheme = (t) => { setThemeState(t); api("/api/settings", {method:"PUT", body: JSON.stringify({theme:t})}); };
  const setFs = (n) => { setFsState(n); api("/api/settings", {method:"PUT", body: JSON.stringify({font_size:n})}); };

  const load = useCallback(async () => {
    const st = await api("/api/state");
    if (!st.settings) return;
    setState(st);
    // apply instance-stored appearance once, on first load
    if (!bootstrapped.current) {
      bootstrapped.current = true;
      if (st.settings.theme) setThemeState(st.settings.theme);
      if (st.settings.font_size) setFsState(st.settings.font_size);
    }
  }, []);
  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const t = setInterval(() => { load(); }, 30000); // reflect auto-sync changes
    return () => clearInterval(t);
  }, [load]);

  // version + changelog: pop up on first visit and after every update
  const loadVersion = useCallback(async (initial) => {
    const v = await api("/api/version");
    if (!v.version) return;
    setVer(v);
    if (initial && lsGet(SEEN_KEY) !== v.version) setShowLog(true);
    if (v.update && v.update.enabled && !v.update.checked_at) {
      const c = await api("/api/version/check", {method:"POST"});
      if (c.update) setVer(prev => ({...prev, update: c.update}));
    }
  }, []);
  useEffect(() => { loadVersion(true); }, [loadVersion]);
  useEffect(() => {
    const t = setInterval(() => loadVersion(false), 15 * 60000);
    return () => clearInterval(t);
  }, [loadVersion]);
  const closeLog = () => { if (ver) lsSet(SEEN_KEY, ver.version); setShowLog(false); };

  const flash = (m) => { setToast(m); setTimeout(()=>setToast(null), 4000); };

  const onDrop = async (poolId) => {
    setOverPool(null);
    if (dragId == null) return;
    await api(`/api/devices/${dragId}`, {method:"PUT", body: JSON.stringify({pool_id: poolId})});
    setDragId(null);
    load();
  };

  const platformLabel = s.platform_label || "UniFi";
  const canSync = s.platform && s.platform !== "none";
  const sync = async () => {
    flash(`Syncing with ${platformLabel}…`);
    const r = await api("/api/sync", {method:"POST"});
    if (r.ok) {
      const bits = [`+${r.added} new`, `${r.greyed} offline`];
      if (r.pooled) bits.push(`${r.pooled} sorted into pools`);
      if (r.moved) bits.push(`${r.moved} → Unallocated`);
      if (r.pruned) bits.push(`${r.pruned} pruned`);
      if (r.skipped) bits.push(`${r.skipped} excluded`);
      flash(`Synced (${r.mode}): ${bits.join(", ")}`);
      load();
    } else {
      flash("Sync failed: " + r.error);
    }
  };

  const quickAdd = async () => {
    const v = newItem.trim();
    if (!v) return;
    // smart parse: if it looks like an IP, use as ip, else name
    const isIp = /^\d{1,3}(\.\d{1,3}){3}$/.test(v);
    const r = await api("/api/devices", {method:"POST", body: JSON.stringify(isIp ? {ip:v} : {name:v})});
    if (r.error) { flash(r.error); return; }
    setNewItem("");
    load();
  };

  const q = query.trim().toLowerCase();
  // IP-ish query (digits + dots): match on octet boundaries so "10.0.1.2"
  // does NOT match "10.0.1.200". Every typed octet must equal the IP's octet.
  const ipish = /^[0-9.]+$/.test(q) && q.includes(".");
  const qOctets = ipish ? q.split(".").filter((s,i,a)=>!(s===""&&i===a.length-1)) : [];
  const ipMatch = (ip) => {
    if (!ipish) return false;
    const io = (ip||"").split(".");
    return qOctets.length <= io.length && qOctets.every((o,i)=> io[i] === o);
  };
  const textMatch = (d) => {
    const fields = ipish ? [d.name,d.hostname,d.mac,d.notes]
                         : [d.ip,d.name,d.hostname,d.mac,d.notes];
    return fields.some(v => (v||"").toLowerCase().includes(q));
  };
  const poolHitFn = (p) => !!q && [p.name,p.notes,p.subnets].some(v => (v||"").toLowerCase().includes(q));
  const filtering = !!q || resOnly;
  const matchDev = (d, poolHit) => {
    if (resOnly && !d.is_reserved) return false;
    if (!q) return true;
    if (poolHit) return true;               // section name / notes / subnet hit
    return ipMatch(d.ip) || textMatch(d);
  };
  // "hide when empty" pools come back as drop targets while dragging, and
  // whenever the user asks to see them (otherwise you couldn't edit them)
  const hiddenEmpty = state.pools.filter(p => p.hide_empty && p.devices.length === 0);
  const shownPools = state.pools
    .filter(p => !(p.hide_empty && p.devices.length === 0) || dragId != null || showHidden)
    .map(p => { const ph = poolHitFn(p); return {...p, devices: p.devices.filter(d=>matchDev(d,ph))}; })
    .filter(p => !filtering || p.devices.length > 0);
  const auth = s.auth || {};
  const logout = async () => {
    const r = await api("/api/logout", {method:"POST"});
    window.location = (r && r.redirect) || "/login";
  };

  const upd = ver && ver.update;
  return (
    <div className="wrap">
      <header className="top">
        <div className="title">{appName}</div>
        <div className="toolbar">
          <span className="count">{state.total} devices</span>
          {canSync && <button onClick={sync} className="primary">⟳ Sync {platformLabel}</button>}
          <button onClick={()=>window.location="/api/export.csv"}>⤓ CSV</button>
          <button onClick={()=>setEditPool({color:"#8b5cf6"})}>+ Pool</button>
          <button onClick={()=>setTheme(theme==="dark"?"light":"dark")} className="ghost"
            title="Toggle light / dark">{theme==="dark" ? "☀" : "🌙"}</button>
          <button className="ghost" title="Smaller text" style={{padding:"6px 9px"}}
            onClick={()=>setFs(Math.max(12, fs-1))}>A−</button>
          <button className="ghost" title="Larger text" style={{padding:"6px 9px", fontSize:"1.15em"}}
            onClick={()=>setFs(Math.min(26, fs+1))}>A+</button>
          <button onClick={()=>setShowSettings(true)} className="ghost" title="Settings">⚙</button>
          {auth.can_logout && (
            <button className="ghost" title={`Signed in${auth.user ? " as " + auth.user : ""} (${auth.authed_via}) — sign out`}
              onClick={logout}>
              <span style={{fontSize:"0.8em"}}>⎋ logout</span>
            </button>
          )}
        </div>
      </header>

      {state.duplicates && state.duplicates.length > 0 && (
        <div className="warn-banner">
          ⚠ <b>Duplicate IP{state.duplicates.length>1?"s":""} in use:</b>{" "}
          {state.duplicates.map((x,i)=>(
            <span key={x.ip}>{i>0 && "  •  "}<b>{x.ip}</b> — {x.devices.join(", ")}</span>
          ))}
        </div>
      )}

      <div className="add-bar">
        <input className="row-input" placeholder="Quick add device (name or IP)…"
          value={newItem} onChange={e=>setNewItem(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter") quickAdd();}} />
        <button className="primary" onClick={quickAdd}>ADD</button>
      </div>

      <div className="filters">
        <input className="row-input search" placeholder="🔍 Search ip / name / notes / mac…"
          value={query} onChange={e=>setQuery(e.target.value)} />
        <button className={"toggle-btn"+(resOnly?" active":"")}
          onClick={()=>setResOnly(!resOnly)}>RES only</button>
        {filtering && <button onClick={()=>{setQuery("");setResOnly(false);}}>clear</button>}
      </div>
      {hiddenEmpty.length > 0 && !filtering && (
        <div className="hidden-note">
          {hiddenEmpty.length} empty pool{hiddenEmpty.length>1?"s":""} hidden{" — "}
          <button className="link" onClick={()=>setShowHidden(!showHidden)}>{showHidden ? "hide" : "show"}</button>
        </div>
      )}

      {shownPools.map(pool => (
        <Pool key={pool.id} pool={pool}
          dragId={dragId} setDragId={setDragId}
          overPool={overPool} setOverPool={setOverPool}
          onDrop={onDrop}
          onEditDevice={setEditDevice}
          onEditPool={setEditPool}
          settings={s}
          collapsed={collapsed.includes(pool.id) && !filtering}
          onToggle={()=>toggleCollapsed(pool.id)}
          reload={load} flash={flash} filtering={filtering} />
      ))}

      {editDevice && (
        <DeviceModal device={editDevice} pools={state.pools}
          onClose={()=>setEditDevice(null)} reload={load} />
      )}
      {editPool && (
        <PoolModal pool={editPool} settings={s}
          onClose={()=>setEditPool(null)} reload={load} flash={flash} />
      )}
      {showSettings && (
        <SettingsModal settings={s} excluded={state.excluded||[]}
          onPreview={setFontPreview}
          onClose={()=>{ setFontPreview(null); setShowSettings(false); }}
          reload={load} flash={flash} />
      )}
      {showLog && ver && (
        <ChangelogModal ver={ver} setVer={setVer} onClose={closeLog} />
      )}
      {ver && (
        <button className="version-tag" onClick={()=>setShowLog(true)}
          title={upd && upd.update_available ? `Update available: v${upd.latest}` : "View changelog"}>
          v{ver.version}
          {upd && upd.update_available && <span className="update-dot"></span>}
        </button>
      )}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

const POOL_STYLE_DEFAULTS = {
  font: "", size: 100, bold: true, italic: false, uppercase: false, spacing: 1,
  name_color: "", tint: 12, show_dot: true, show_subnets: true, show_notes: true, show_count: true,
};

function PoolHeader({pool, settings, count, collapsed, onToggle, actions}) {
  const st = {...POOL_STYLE_DEFAULTS, ...(pool.style || {})};
  const fontCssVal = st.font ? fontCss(settings || {}, "head", st.font) : null;
  const nameStyle = {
    fontFamily: fontCssVal || "var(--font-head)",
    fontSize: `${st.size / 100}em`,
    fontWeight: st.bold ? 700 : 400,
    fontStyle: st.italic ? "italic" : "normal",
    textTransform: st.uppercase ? "uppercase" : "none",
    letterSpacing: `${st.spacing}px`,
    color: st.name_color || undefined,
  };
  return (
    <div className="pool-head" style={{background: hexToRgba(pool.color || "#6b7280", st.tint / 100)}}>
      {onToggle !== undefined && (
        <button className={"caret" + (collapsed ? " closed" : "")} onClick={onToggle}
          title={collapsed ? "Expand" : "Collapse"}>▼</button>
      )}
      {st.show_dot && <span className="pool-dot" style={{background: pool.color}}></span>}
      <span className="pool-name" style={nameStyle}>{pool.name || "Pool name"}</span>
      {st.show_subnets && pool.subnets && <span className="pool-meta sub">[{pool.subnets}]</span>}
      {st.show_notes && pool.notes && <span className="pool-meta">— {pool.notes}</span>}
      <span className="spacer"></span>
      {st.show_count && <span className="pool-meta">{count}</span>}
      {actions}
    </div>
  );
}

function Pool({pool, dragId, setDragId, overPool, setOverPool, onDrop,
               onEditDevice, onEditPool, reload, flash, settings, collapsed, onToggle}) {
  const faint = hexToRgba(pool.color, 0.07);
  const isOver = overPool === pool.id;

  const delPool = async () => {
    if (!confirm(`Delete pool "${pool.name}"? Devices move to Unallocated.`)) return;
    await api(`/api/pools/${pool.id}`, {method:"DELETE"});
    reload();
  };

  // the whole card is the drop target, so collapsed pools still accept drops
  return (
    <div className={"pool" + (collapsed ? " collapsed" : "") + (isOver && collapsed ? " drag-over" : "")}
      style={{background: faint, borderColor: hexToRgba(pool.color,0.35)}}
      onDragOver={e=>{e.preventDefault(); setOverPool(pool.id);}}
      onDragLeave={e=>{ if (!e.currentTarget.contains(e.relatedTarget)) setOverPool(null); }}
      onDrop={()=>onDrop(pool.id)}>
      <PoolHeader pool={pool} settings={settings} count={pool.devices.length}
        collapsed={collapsed} onToggle={onToggle}
        actions={
          <div className="pool-actions" style={{display:"flex",gap:"6px",marginLeft:"8px"}}>
            <button onClick={()=>onEditPool(pool)}>edit</button>
            {!pool.is_default && <button className="danger" onClick={delPool}>×</button>}
          </div>} />
      {!collapsed && (
        <div className={"pool-body" + (isOver ? " drag-over" : "")}>
          {pool.devices.length === 0 && (
            <div className="empty-hint">No devices — drag one here.</div>
          )}
          {pool.devices.map(d => (
            <Device key={d.id} d={d} poolColor={pool.color} setDragId={setDragId}
              onEdit={()=>onEditDevice(d)} reload={reload} />
          ))}
        </div>
      )}
    </div>
  );
}

function Device({d, poolColor, setDragId, onEdit, reload}) {
  const del = async (e) => {
    e.stopPropagation();
    const msg = d.mac
      ? `Delete ${d.name || d.ip || d.mac}?\n\nThis excludes it permanently — syncs won't re-add it. You can restore it later from Settings → Maintenance.`
      : `Delete ${d.name || d.ip || "this device"}?`;
    if (!confirm(msg)) return;
    await api(`/api/devices/${d.id}`, {method:"DELETE"});
    reload();
  };
  const toggleLock = async (e) => {
    e.stopPropagation();
    await api(`/api/devices/${d.id}`, {method:"PUT", body: JSON.stringify({locked: !d.locked})});
    reload();
  };
  // online = stronger (pool-color accent + wash); offline recedes via .offline opacity
  const style = d.is_online
    ? { borderLeftColor: poolColor, background: hexToRgba(poolColor, 0.32) }
    : { borderLeftColor: "transparent" };
  return (
    <div className={"dev" + (d.is_online ? "" : " offline")} style={style}
      draggable onDragStart={()=>setDragId(d.id)} onDragEnd={()=>setDragId(null)}>
      <span className="grip">⠿</span>
      <span className="ip">
        {d.ip || "—"}
        {d.dup_ip && <span className="tag dup" title="This IP is actively claimed by more than one device">⚠</span>}
      </span>
      <span className="nm">
        {d.name || d.hostname || "(unnamed)"}
        {d.name && d.hostname && <span className="host">{d.hostname}</span>}
      </span>
      <span className="mac">{d.mac || ""}</span>
      <span className="badges">
        {d.is_reserved ? <span className="tag res">RES</span> : null}
        {d.source === "manual" ? <span className="tag manual">MANUAL</span> : null}
        {d.stale_ip ? <span className="tag stale"
          title="Last-known IP only — another device holds (or more recently held) this address. Not counted as a duplicate.">STALE</span> : null}
        {!d.is_online ? <span className="tag">OFFLINE</span> : null}
      </span>
      <button className={"lockbtn" + (d.locked ? " on" : "")} onClick={toggleLock}
        title={d.locked ? "Locked — never moved by auto-sort or the grace-period fallback" : "Unlocked — click to lock in place"}>
        {d.locked ? "🔒" : "🔓"}
      </button>
      <span className="ed">
        <button onClick={onEdit}>edit</button>
        <button className="danger" onClick={del}>×</button>
      </span>
    </div>
  );
}

        <div className="field"><label>Pool</label>

            {pools.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select></div>
        <div className="field check"><label>
          <input type="checkbox" checked={f.is_reserved} onChange={e=>set("is_reserved",e.target.checked)} />
          Reserved IP</label></div>
        <div className="field check"><label>
          <input type="checkbox" checked={f.locked} onChange={e=>set("locked",e.target.checked)} />

        <div className="field"><label>Notes</label>

  const isNew = !pool.id;
  const set = (k,v)=>setF({...f,[k]:v});
  const save = async () => {
    setErr(null);
    const body = {...f, claim_matching: f.claim_matching && !!f.subnets.trim()};
    const r = isNew
      ? await api("/api/pools", {method:"POST", body: JSON.stringify(body)})

    <div className="overlay" onClick={onClose}>

          <input type="checkbox" checked={f.claim_matching}
            onChange={e=>set("claim_matching",e.target.checked)} />

        <div className="field"><label>Notes</label>
          <input value={f.notes} onChange={e=>set("notes",e.target.value)}

        <div className="section-label">Header style</div>
        <div className="style-grid">
          <div className="field"><label>Font</label>
            <select value={f.style.font} onChange={e=>setSt("font", e.target.value)}>
              <option value="">Header font from Appearance</option>
              {fontOpts.map(o=><option key={o.id} value={o.id}>{o.label}</option>)}
            </select></div>
          <div className="field"><label>Name color</label>
            <div className="inline">
              <input type="color" style={{padding:"2px", height:"36px"}}
                value={f.style.name_color || "#e6e6ea"} onChange={e=>setSt("name_color", e.target.value)} />
              <button type="button" onClick={()=>setSt("name_color","")}
                disabled={!f.style.name_color}>default</button>
            </div></div>
          <div className="field"><label>Size — {f.style.size}%</label>
            <input type="range" min="60" max="250" step="5" value={f.style.size}
              onChange={e=>setSt("size", parseInt(e.target.value))} /></div>
          <div className="field"><label>Letter spacing — {f.style.spacing}px</label>
            <input type="range" min="0" max="12" value={f.style.spacing}
              onChange={e=>setSt("spacing", parseInt(e.target.value))} /></div>
          <div className="field"><label>Header tint — {f.style.tint}%</label>
            <input type="range" min="0" max="60" value={f.style.tint}
              onChange={e=>setSt("tint", parseInt(e.target.value))} /></div>
          <div></div>
          {[["bold","Bold"],["italic","Italic"],["uppercase","UPPERCASE"],
            ["show_dot","Show color dot"],["show_subnets","Show subnets"],
            ["show_notes","Show notes"],["show_count","Show device count"]].map(([k,l])=>(
            <div className="field check" key={k}><label>
              <input type="checkbox" checked={!!f.style[k]} onChange={e=>setSt(k, e.target.checked)} />
              {l}</label></div>
          ))}
        </div>
        {err && <div className="test-result err">{err}</div>}
        <div className="modal-actions">
          <button type="button" onClick={()=>setF(prev=>({...prev, style: {...POOL_STYLE_DEFAULTS}}))}>Reset style</button>
          <div className="right">
            <button onClick={onClose}>Cancel</button>
            <button className="primary" onClick={save}>Save</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PlatformField({field, value, secretSet, cleared, onChange, onClear}) {
  if (field.kind === "checkbox") {
    return (
      <div className="field check"><label>
        <input type="checkbox" checked={!!value} onChange={e=>onChange(e.target.checked)} />
        {field.label}</label></div>
    );
  }
  const isKey = field.secret && /_key$/.test(field.key) && /PRIVATE KEY/.test(field.placeholder||"");
  const saved = field.secret && secretSet && !cleared;
  return (
    <div className="field">
      <label>
        {field.label}{" "}
        {field.secret && (saved
          ? <span style={{color:"var(--ok)"}}>✓ saved — leave blank to keep
              <button className="link" type="button" onClick={onClear}>clear</button></span>
          : cleared ? <span style={{color:"var(--danger)"}}>will be cleared on save</span> : null)}
      </label>
      {isKey
        ? <textarea className="key" rows="3" value={value||""} onChange={e=>onChange(e.target.value)}
            placeholder={saved ? "•••••••• (stored)" : field.placeholder} />
        : <input type={field.secret ? "password" : field.kind === "number" ? "number" : "text"}
            value={value||""} onChange={e=>onChange(e.target.value)}
            placeholder={saved ? "•••••••• (stored)" : field.placeholder} />}
      {field.help && <div className="hint">{field.help}</div>}
    </div>
  );
}

function SettingsModal({settings, excluded, onPreview, onClose, reload, flash}) {
  const platforms = settings.platforms || [];
  const [tab, setTab] = useState("platform");
  const [f, setF] = useState({
    platform: settings.platform || "unifi",
    ...(settings.platform_values || {}),
    grace_days: settings.grace_days ?? 7,
    auto_sync_value: settings.auto_sync_value ?? 0,
    auto_sync_unit: settings.auto_sync_unit || "minutes",
    auto_pool_new: settings.auto_pool_new ?? true,
    auto_pool_every_sync: !!settings.auto_pool_every_sync,
    prune_days: settings.prune_days ?? 0,
    app_name: settings.app_name || "",
    font_logo: settings.font_logo || "",
    font_head: settings.font_head || "",
    font_body: settings.font_body || "",
    update_check: settings.update_check ?? true,
  });
  const [cleared, setCleared] = useState([]);
  const [test, setTest] = useState(null);
  const [sorting, setSorting] = useState(false);
  const set = (k,v)=>setF(prev=>({...prev,[k]:v}));
  const plat = platforms.find(p=>p.id===f.platform) || {fields:[]};

  useEffect(() => {
    onPreview({logo: f.font_logo, head: f.font_head, body: f.font_body});
  }, [f.font_logo, f.font_head, f.font_body]);

  const save = async () => {
    const r = await api("/api/settings", {method:"PUT",
      body: JSON.stringify({...f, clear_secrets: cleared})});
    if (r && r.error) { flash(r.error); return; }
    flash("Settings saved");
    await reload();
    onClose();
  };
  const doTest = async () => {
    setTest({msg:"Testing…"});
    const r = await api("/api/platform/test", {method:"POST", body: JSON.stringify(f)});
    setTest(r.ok ? {ok:true, msg:`Connected (${r.mode}) — ${r.count} clients, ${r.online} online`}
                 : {ok:false, msg:r.error});
  };
  const sortNow = async () => {
    setSorting(true);
    const r = await api("/api/pools/auto-sort", {method:"POST"});
    setSorting(false);
    flash(r.moved ? `${r.moved} device${r.moved>1?"s":""} moved into matching pools`
                  : "Nothing to move — every device is already in its matching pool");
    reload();
  };
  const restore = async (mac) => {
    await api(`/api/excluded/${encodeURIComponent(mac)}`, {method:"DELETE"});
    flash("Restored — will re-add on next sync if the controller still sees it");
    reload();
  };

  const fontOpts = settings.font_options || [];
  const builtin = fontOpts.filter(o=>o.kind==="builtin");
  const files = fontOpts.filter(o=>o.kind==="file");
  const defLabel = (slot) => {
    const id = (settings.font_defaults||{})[slot];
    const o = fontOpts.find(x=>x.id===id);
    return o ? o.label : "Monospace";
  };
  const fontSelect = (slot, label) => (
    <div className="field"><label>{label}</label>
      <select value={f["font_"+slot]} onChange={e=>set("font_"+slot, e.target.value)}>
        <option value="">Default ({defLabel(slot)})</option>
        <optgroup label="Built-in">
          {builtin.map(o=><option key={o.id} value={o.id}>{o.label}</option>)}
        </optgroup>
        {files.length > 0 && <optgroup label="Installed fonts">
          {files.map(o=><option key={o.id} value={o.id}>{o.label}{o.origin==="data" ? " (data/fonts)" : ""}</option>)}
        </optgroup>}
      </select></div>
  );

  const tabs = [["platform","Platform"],["sync","Sync & pools"],["look","Appearance"],["security","Security"],["maint","Maintenance"]];
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal wide" onClick={e=>e.stopPropagation()}>
        <h3>Settings</h3>
        <div className="tabs">
          {tabs.map(([id,l])=>(
            <button key={id} className={tab===id?"on":""} onClick={()=>setTab(id)}>{l}</button>
          ))}
        </div>

        {tab === "platform" && <>
          <div className="field"><label>Sync platform</label>
            <select value={f.platform} onChange={e=>{ set("platform", e.target.value); setTest(null); }}>
              {platforms.map(p=><option key={p.id} value={p.id}>{p.label}{p.experimental ? " — experimental" : ""}</option>)}
            </select></div>
          {plat.help && <div className="help-box">
            {plat.help}{plat.experimental && <span className="tag exp">EXPERIMENTAL</span>}
          </div>}
          {plat.fields.map(fd=>(
            <PlatformField key={fd.key} field={fd} value={f[fd.key]}
              secretSet={(settings.secrets_set||{})[fd.key]}
              cleared={cleared.includes(fd.key)}
              onChange={v=>set(fd.key, v)}
              onClear={()=>setCleared([...cleared, fd.key])} />
          ))}
          {test && <div className={"test-result "+(test.ok?"ok":"err")}>{test.msg}</div>}
        </>}

        {tab === "sync" && <>
          <div className="field"><label>Auto-sync every (0 = manual only)</label>
            <div className="inline">
              <input type="number" min="0" value={f.auto_sync_value}
                onChange={e=>set("auto_sync_value",e.target.value)} />
              <select value={f.auto_sync_unit} onChange={e=>set("auto_sync_unit",e.target.value)}>
                <option value="minutes">minutes</option>
                <option value="hours">hours</option>
                <option value="days">days</option>
              </select>
            </div></div>
          <div className="field"><label>Grace period (days offline before a device falls back to Unallocated)</label>
            <input type="number" min="0" value={f.grace_days}
              onChange={e=>set("grace_days",e.target.value)} /></div>
          <div className="field check"><label>
            <input type="checkbox" checked={!!f.auto_pool_new} onChange={e=>set("auto_pool_new",e.target.checked)} />
            Put new devices straight into the pool whose subnet contains their IP</label></div>
          <div className="field check"><label>
            <input type="checkbox" checked={!!f.auto_pool_every_sync} onChange={e=>set("auto_pool_every_sync",e.target.checked)} />
            Re-sort every device into its matching pool on every sync (manual and timed).
            Overrides drag-and-drop; lock a device to keep it where you put it.</label></div>
          <div className="field">
            <button onClick={sortNow} disabled={sorting}>{sorting ? "Sorting…" : "⇢ Sort all devices into matching pools now"}</button>
            <div className="hint">One-off: moves every unlocked device whose IP falls in a pool's subnet into that pool
              (most specific subnet wins). Devices with no matching pool, locked devices and stale
              offline devices stay where they are.</div>
          </div>
          <div className="field"><label>Forget offline clients not seen for N days (0 = never)</label>
            <input type="number" min="0" value={f.prune_days}
              onChange={e=>set("prune_days",e.target.value)} />
            <div className="hint">Controllers remember every client they have ever seen. This drops old history
              on sync. Devices that are locked, reserved, added manually or have notes are never pruned,
              and a pruned device comes back if it reconnects.</div></div>
        </>}

        {tab === "look" && <>
          <div className="field"><label>App name (top-left wordmark, browser tab, login page)</label>
            <input value={f.app_name} maxLength="60" onChange={e=>set("app_name",e.target.value)}
              placeholder="SPAZCAT IPAM" /></div>
          {fontSelect("logo", "Logo font")}
          {fontSelect("head", "Header font (pool names, dialog titles)")}
          {fontSelect("body", "Text font (device rows, buttons, everything else)")}
          <div className="help-box">
            Changes preview live. To add fonts, commit <code>.otf</code> / <code>.ttf</code> / <code>.woff</code> / <code>.woff2</code> files
            to <code>app/static/fonts/</code> in GitHub (baked into the image), or drop them in <code>data/fonts/</code> on
            the host (no rebuild), then reload.
            {files.length === 0 && <><br/>No font files installed yet.</>}
          </div>
        </>}

        {tab === "security" && <SecurityTab />}

        {tab === "maint" && <>
          <div className="field check"><label>
            <input type="checkbox" checked={!!f.update_check} disabled={!settings.update_check_allowed}
              onChange={e=>set("update_check",e.target.checked)} />
            Check for new versions (reads the image's tag list from ghcr.io every 6 hours){!settings.update_check_allowed && " — disabled by IPAM_UPDATE_CHECK"}</label></div>
          <div className="excluded-block">
            <label>Excluded devices {excluded.length ? `(${excluded.length})` : ""}</label>
            {excluded.length === 0
              ? <div className="excluded-empty">Nothing excluded. Deleting a synced device adds it here.</div>
              : <div className="excluded-list">
                  {excluded.map(x=>(
                    <div className="excluded-row" key={x.mac}>
                      <span className="ex-name">{x.name || "(unnamed)"}</span>
                      <span className="ex-ip">{x.ip}</span>
                      <span className="ex-mac">{x.mac}</span>
                      <button onClick={()=>restore(x.mac)}>restore</button>
                    </div>
                  ))}
                </div>}
          </div>
        </>}

        <div className="modal-actions">
          {tab === "platform" && f.platform !== "none"
            ? <button onClick={doTest}>Test connection</button> : <span></span>}
          <div className="right">
            <button onClick={onClose}>Cancel</button>
            <button className="primary" onClick={save}>Save</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SecurityTab() {
  const [r, setR] = useState(null);
  useEffect(() => { api("/api/auth/status").then(setR); }, []);
  if (!r) return <div className="hint">Loading…</div>;
  const pills = (list) => list.length
    ? list.map(m => <span key={m} className={"pill" + (m !== "none" ? " on" : "")}>{m}</span>)
    : <span className="pill" style={{color:"var(--danger)"}}>blocked</span>;
  const o = r.oidc || {};
  return <>
    {(r.warnings||[]).map((w,i)=><div key={i} className="sec-warn">⚠ {w}</div>)}
    <table className="sec-table"><tbody>
      <tr><td>You are connecting from</td><td>{r.client_ip || "?"} → <b>{r.zone.toUpperCase()}</b>
        {r.via_proxy ? ` (via proxy ${r.peer_ip})` : ""}</td></tr>
      <tr><td>Signed in</td><td>{r.authed_via ? `${r.user || "?"} via ${r.authed_via}` : (r.required ? "no" : "not required here")}</td></tr>
      <tr><td>LAN sign-in</td><td>{pills(r.lan_methods)}</td></tr>
      <tr><td>WAN sign-in</td><td>{pills(r.wan_methods)}</td></tr>
      <tr><td>LAN networks</td><td>{r.lan_networks.join(", ")}</td></tr>
      <tr><td>Trusted proxies</td><td>{r.trusted_proxies.join(", ")}</td></tr>
      <tr><td>Local users</td><td>{r.local_users.join(", ") || "—"}</td></tr>
      <tr><td>Access tokens</td><td>{r.tokens.length ? `${r.tokens.join(", ")} (URL parameter ?${r.token_param}=…)` : "—"}</td></tr>
      <tr><td>OIDC</td><td>{o.configured
        ? <>{o.issuer}<br/>client {o.client_id}<br/>redirect URI <code>{o.redirect_uri}</code><br/>
            button "{o.button_text}"{o.auto_login ? ", auto sign-in on" : ""}
            {(o.allowed_users.length || o.allowed_groups.length) ?
              <><br/>allowed: {[...o.allowed_users, ...o.allowed_groups.map(x=>"group:"+x)].join(", ")}</> : null}</>
        : "not configured"}</td></tr>
    </tbody></table>
    <div className="help-box">
      Sign-in rules are set with environment variables in your compose file (<code>IPAM_AUTH_LAN</code>,{" "}
      <code>IPAM_AUTH_WAN</code>, …), not here. That way nobody using the app can switch them off.
      See the README section “Authentication”.
    </div>
  </>;
}

// Minimal markdown for CHANGELOG.md: ### headings, "- " bullets (with
// indented continuation lines), paragraphs, **bold**, *em* and `code`.
function inlineMd(text) {
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*]+\*)/g).map((part, i) => {
    if (/^\*\*[^*]+\*\*$/.test(part)) return <b key={i}>{part.slice(2,-2)}</b>;
    if (/^`[^`]+`$/.test(part)) return <code key={i}>{part.slice(1,-1)}</code>;
    if (/^\*[^*]+\*$/.test(part)) return <em key={i}>{part.slice(1,-1)}</em>;
    return part;
  });
}
function MdBlock({text}) {
  const out = [];
  let list = null, para = null;
  const flush = () => {
    if (list) { out.push(<ul key={out.length}>{list.map((l,i)=><li key={i}>{inlineMd(l)}</li>)}</ul>); list = null; }
    if (para) { out.push(<p key={out.length}>{inlineMd(para)}</p>); para = null; }
  };
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    if (!line.trim()) { flush(); continue; }
    if (line.startsWith("### ")) { flush(); out.push(<h4 key={out.length}>{line.slice(4)}</h4>); continue; }
    if (/^\s*[-*] /.test(line)) {
      if (para) flush();
      list = list || [];
      list.push(line.replace(/^\s*[-*] /, ""));
      continue;
    }
    if (list && /^\s+/.test(raw)) { list[list.length-1] += " " + line.trim(); continue; }
    if (list) flush();
    para = para ? para + " " + line.trim() : line.trim();
  }
  flush();
  return <div className="cl-body">{out}</div>;
}

function ChangelogModal({ver, setVer, onClose}) {
  const [checking, setChecking] = useState(false);
  const u = ver.update || {};
  const checkNow = async () => {
    setChecking(true);
    const r = await api("/api/version/check", {method:"POST"});
    setChecking(false);
    if (r.update) setVer({...ver, update: r.update});
  };
  const when = u.checked_at ? new Date(u.checked_at*1000).toLocaleString() : "never";
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal wide" onClick={e=>e.stopPropagation()}>
        <h3>What's new — v{ver.version}</h3>
        {u.update_available && (
          <div className="update-box">
            <b>Update available: v{u.latest}</b><br/>
            Pull the new image to upgrade (your <code>data/</code> folder carries over and is backed up
            automatically): <code>docker compose pull &amp;&amp; docker compose up -d</code>
          </div>
        )}
        <div style={{fontSize:"0.7em", color:"var(--muted)", marginBottom:"12px", display:"flex", gap:"8px", alignItems:"center", flexWrap:"wrap"}}>
          {u.enabled
            ? <>{u.update_available ? "" : "You're up to date. "}Last checked: {when}
                {u.error && <span style={{color:"var(--danger)"}}> (check failed)</span>}
                <button style={{padding:"3px 9px"}} disabled={checking} onClick={checkNow}>
                  {checking ? "checking…" : "check now"}</button></>
            : <>Update checks are off (Settings → Maintenance).</>}
        </div>
        {(ver.changelog||[]).map(e=>(
          <div className="cl-entry" key={e.version}>
            <div className="cl-head">
              <span className="cl-ver">v{e.version}</span>
              {e.date && <span className="cl-date">{e.date}</span>}
              {e.version === ver.version && <span className="tag cl-cur">INSTALLED</span>}
            </div>
            <MdBlock text={e.body} />
          </div>
        ))}
        <div className="modal-actions">
          <span></span>
          <button className="primary" onClick={onClose}>Got it</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
