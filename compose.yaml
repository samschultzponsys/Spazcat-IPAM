# IMAGE deploy. Runs the prebuilt image from GHCR (built by the GitHub Action).
# Run from the repo root:  docker compose up -d
# Update:                  docker compose pull && docker compose up -d
#
# Your data lives in ./data on the host (DB, automatic pre-upgrade backups in
# ./data/backups, optional drop-in fonts in ./data/fonts). Pulling a new image
# never touches it, so every new container picks up where the last one left off.
#
# Pin a version instead of latest if you prefer, e.g. :1.1 (tags are x.y).
services:
  spazcat-ipam:
    image: ghcr.io/samschultzponsys/spazcat-ipam:latest
    container_name: spazcat-ipam
    pull_policy: always
    environment:
      TZ: America/Chicago
      PORT: "20080"
      IPAM_DB: /data/ipam.db

      # --- Optional auth (enable to expose to WAN) ---
      # IPAM_AUTH_ENABLED: "true"
      # IPAM_AUTH_USER: "sam"
      # IPAM_AUTH_PASSWORD: "change-me"          # or IPAM_AUTH_PASSWORD_HASH
      # IPAM_SESSION_DAYS: "30"
      # IPAM_COOKIE_SECURE: "true"               # when behind HTTPS

      # --- Update check (on by default; reads this image's tag list on ghcr.io) ---
      # IPAM_UPDATE_CHECK: "false"               # hard-disable, overrides the UI toggle
      # IPAM_UPDATE_IMAGE: "ghcr.io/you/your-fork"
    volumes:
      - ./data:/data
    ports:
      - "20080:20080"
    restart: unless-stopped
