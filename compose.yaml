# Spazcat IPAM - runs the prebuilt image from GHCR (built by the GitHub Action).
# Run from this folder:  docker compose up -d
# Update:                docker compose pull && docker compose up -d
#
# Your data lives in ./data on the host (DB, automatic pre-upgrade backups in
# ./data/backups, optional drop-in fonts in ./data/fonts). Pulling a new image
# never touches it, so every new container picks up where the last one left off.
#
# Pin a version instead of latest if you prefer, e.g. :1.2 (tags are x.y).
services:
  spazcat-ipam:
    image: ghcr.io/samschultzponsys/spazcat-ipam:latest
    container_name: spazcat-ipam
    pull_policy: always
    environment:
      TZ: America/Chicago
      PORT: "20080"
      IPAM_DB: /data/ipam.db

      # ---------------------------------------------------------------------
      # Sign-in is set up in the app: Settings -> Security. On first start the
      # log shows the admin password:  docker logs spazcat-ipam
      #
      # Everything below is OPTIONAL. An environment variable overrides (and
      # locks) the matching UI setting - handy for recovery. See README
      # "Environment overrides & recovery" for the full list.
      # ---------------------------------------------------------------------
      # IPAM_AUTH_RESET: "true"                  # reset Security settings once, then remove
      # IPAM_AUTH_USER: "rescue"                 # emergency user while locked out...
      # IPAM_AUTH_PASSWORD: "something-long"     # ...remove both afterwards
      # IPAM_AUTH_LAN: "none"                    # force methods: none|local|oidc|token
      # IPAM_AUTH_WAN: "oidc,local"
      # IPAM_TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1/32"

      # --- Update check (on by default; reads this image's tag list on ghcr.io) ---
      # IPAM_UPDATE_CHECK: "false"
    volumes:
      - ./data:/data
    ports:
      - "20080:20080"
    restart: unless-stopped
